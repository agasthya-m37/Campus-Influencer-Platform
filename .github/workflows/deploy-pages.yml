name: Deploy to GitHub Pages

# Builds the static export and publishes it. Runs on every push to main or
# gamified-1 (a preview branch — remove once merged), and can be triggered by
# hand from the Actions tab. Requires the repo's Settings -> Pages -> Source
# to be "GitHub Actions", not "Deploy from a branch" (the latter serves the
# repo's raw files through Jekyll instead of this workflow's build).
on:
  push:
    branches: [main, gamified-1]
  workflow_dispatch:

# Pages deployment needs these; `id-token` is what lets the deploy step prove
# it came from this workflow rather than anywhere else.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time. A queued run is not cancelled, so a deploy already in
# flight finishes rather than leaving the site half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # `npm install`, not `npm ci`. The lock file is generated on macOS and
      # cannot record the Linux-only packages that Next's optional `sharp`
      # dependency pulls in, so `npm ci` rejects it on this runner whatever
      # --omit flags it is given. `npm install` resolves those for the
      # platform it is on and otherwise honours the committed lock file.
      - name: Install
        run: npm install --no-audit --no-fund

      # Build first. Next generates the PageProps and LayoutProps types into
      # .next/types during a build, and tsconfig includes them, so a
      # typecheck on a clean checkout fails on every route file until they
      # exist.
      - name: Build static export
        run: npx next build
        env:
          GITHUB_PAGES: "true"

      # The same checks that guard a local commit. These run after the build
      # rather than before it, so a regression still fails the workflow and
      # blocks the deploy — the deploy job only runs if this job succeeds.
      - name: Verify
        run: npm run verify

      # Pages runs the output through Jekyll by default, which strips any
      # directory beginning with an underscore — including Next's _next.
      - name: Disable Jekyll processing
        run: touch out/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
